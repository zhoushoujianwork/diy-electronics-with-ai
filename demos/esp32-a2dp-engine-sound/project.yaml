schema: 1
id: esp32-a2dp-engine-sound
name: ESP32 A2DP Engine Sound
kind: demo
status: build-verified
summary: BOOT-controlled engine synthesis on original ESP32 with A2DP source output
owners:
  - human-ai-lab
toolchains:
  - esp-idf-5.5.2
  - cmake
boards:
  - espressif-esp32-devkitc-32e
modules:
  - bluetooth-classic-a2dp-source
  - wifi-softap-pairing-portal
  - procedural-audio
  - boot-button-throttle
validation:
  build: passed
  hardware: partial
notes:
  - Firmware targets original ESP32 only, not ESP32-S3.
  - USB flashing, boot, discovery and a 120-second offline synthesis/control soak passed on ESP32-D0WD-V3 rev v3.1.
  - Two GPIO0 throttle cycles passed via USB-UART DTR stimulation; manual mechanical BOOT acceptance remains pending.
  - Beats Flex is saved as the exact NVS target; a 90-second scan and a 120-second pairing-window rescan did not discover it.
  - A temporary WPA2 SoftAP portal can list recent Bluetooth inquiry results and request a manual connection; 120 seconds of AP plus scanning passed without audio load.
  - The AP password defaults to a per-boot random value; a local eight-digit PIN can be saved in device NVS without committing the credential.
  - Captive portal DNS, DHCP page advertisement, HTTP redirect and page responses passed a local AP client check; automatic phone popup awaits user confirmation.
  - Audible output, reconnection and end-to-end latency await a discoverable headset.
  - Exact measured scope and pending physical checks are recorded in docs/validation.md.
