<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">车载双电源模块设计示意</title>
  <desc id="desc">车载 12V 保护降压和受保护单节电池充电备用供电，经过电源切换后给主控 5V 和 4G 可选供电；现有 BAT 3.9V 支路，VIN 5V 支路仍是规划。常供电控制器接按键、ACC、IMU 和外部唤醒。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#537189"/></marker>
    <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#41657d;stroke-width:2;rx:12}.out{fill:#e6f4ec;stroke:#287454;stroke-width:2;rx:12}.ctrl{fill:#fff3db;stroke:#9a6a1d;stroke-width:2;rx:12}.line{fill:none;stroke:#537189;stroke-width:2.5;marker-end:url(#arrow)}.text{font:19px sans-serif;fill:#1e3443;text-anchor:middle}.small{font:14px sans-serif;fill:#4b5f6d;text-anchor:middle}.label{font:13px sans-serif;fill:#496173}</style>
  </defs>
  <rect class="bg" width="900" height="380"/>
  <text x="450" y="31" class="text">车载双电源板 R1 · 电源路径设计示意</text>
  <rect class="box" x="25" y="65" width="175" height="76"/><text class="text" x="112" y="95">车载 12V</text><text class="small" x="112" y="119">保险丝 · TVS · 保护</text>
  <rect class="box" x="244" y="65" width="177" height="76"/><text class="text" x="332" y="95">车载降压</text><text class="small" x="332" y="119">主供电与充电</text>
  <rect class="box" x="25" y="174" width="175" height="76"/><text class="text" x="112" y="204">受保护 1S 电池</text><text class="small" x="112" y="228">NTC · 备用供电</text>
  <rect class="box" x="244" y="174" width="177" height="76"/><text class="text" x="332" y="204">电池升压/稳压</text><text class="small" x="332" y="228">运行时待切换</text>
  <rect class="box" x="480" y="117" width="150" height="83"/><text class="text" x="555" y="150">优先切源</text><text class="small" x="555" y="175">车载优先</text>
  <rect class="out" x="650" y="69" width="225" height="76"/><text class="text" x="762" y="100">主控 5V / 1A</text><text class="small" x="762" y="124">受控输出</text>
  <rect class="out" x="650" y="163" width="225" height="91"/><text class="text" x="762" y="190">4G 人工选择一路</text><text class="small" x="762" y="215">BAT 3.9V/2A：现有设计</text><text class="small" x="762" y="238">VIN 5V/2A：待落图</text>
  <path class="line" d="M200 103H244"/><path class="line" d="M200 212H244"/><path class="line" d="M270 141V159H160V174"/><text class="label" x="292" y="163">BQ25606 充电</text><path class="line" d="M421 103H451V144H480"/><path class="line" d="M421 212H451V174H480"/><path class="line" d="M630 158H638V107H650"/><path class="line" d="M630 158H638V208H650"/>
  <rect class="ctrl" x="176" y="287" width="548" height="61"/><text class="text" x="450" y="314">3.0V 常供电控制器 · STM32L031 + IMU</text><text class="small" x="450" y="337">硬件总开关 / 按键 / ACC / 外部 WAKE_N / 管理 UART</text>
  <text class="label" x="30" y="368">电气设计原型；原理图尚未布线，非 PCB 或实机证据</text>
</svg>
