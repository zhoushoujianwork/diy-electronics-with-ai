<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">StickS3 GPS to MotoBox — proposed 4G architecture</title>
  <desc id="desc">GPS Unit sends GNSS data to StickS3 over UART2. StickS3 connects through an independently powered ML307R-DL Tiny AT board over UART1 and 4G to MotoBox. This diagram is not hardware validation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#65d4c2" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="24" fill="#101c29"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="72" fill="#f4f8fc" font-size="44" font-weight="700">StickS3 GPS → MotoBox</text>
    <text x="48" y="115" fill="#a8bacd" font-size="26">GNSS tracker · ML307R-DL Tiny 4G uplink</text>

    <g fill="#192c3d" stroke="#35506a" stroke-width="2">
      <rect x="40" y="166" width="204" height="244" rx="18"/>
      <rect x="264" y="166" width="204" height="244" rx="18"/>
      <rect x="488" y="166" width="204" height="244" rx="18"/>
      <rect x="712" y="166" width="204" height="244" rx="18"/>
    </g>

    <g fill="none" stroke="#65d4c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="142" cy="246" r="32"/>
      <circle cx="142" cy="246" r="10"/>
      <path d="M142 200 V218 M142 274 V292 M96 246 H114 M170 246 H188"/>
      <rect x="336" y="198" width="60" height="96" rx="14"/>
      <path d="M348 215 H384 V265 H348 Z M361 280 H371"/>
      <rect x="550" y="211" width="80" height="70" rx="8"/>
      <path d="M563 225 H617 M563 239 H617 M563 253 H617"/>
      <path d="M770 277 H846 C869 277 874 241 851 235 C851 199 796 195 785 230 C753 220 739 269 770 277 Z"/>
    </g>

    <g text-anchor="middle">
      <g fill="#f4f8fc" font-size="32" font-weight="700">
        <text x="142" y="340">GPS Unit</text>
        <text x="366" y="340">StickS3</text>
        <text x="590" y="340">ML307R-DL</text>
        <text x="814" y="340">MotoBox</text>
      </g>
      <g fill="#a8bacd" font-size="24">
        <text x="142" y="377">v1.1 · AT6668</text>
        <text x="366" y="377">K150 · ESP32-S3</text>
        <text x="590" y="377">Tiny · AT board</text>
        <text x="814" y="377">Service + mini app</text>
      </g>
      <g fill="#65d4c2" font-size="23">
        <text x="254" y="235">UART2</text>
        <text x="478" y="235">UART1</text>
        <text x="702" y="235">4G TLS</text>
      </g>
    </g>
    <g fill="none" stroke="#65d4c2" stroke-width="3" marker-end="url(#arrow)">
      <path d="M246 254 H258"/>
      <path d="M470 254 H482"/>
      <path d="M694 254 H706"/>
    </g>

    <text x="48" y="462" fill="#f4f8fc" font-size="27">MQTT TLS · RAM offline queue · Code binding</text>
    <text x="48" y="505" fill="#a8bacd" font-size="22">Architecture diagram · 4G hardware tests pending</text>
  </g>
</svg>
