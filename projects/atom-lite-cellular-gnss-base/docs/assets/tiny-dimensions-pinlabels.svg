<path d="M46 594H1154" stroke="#cbd5e1"/>
<text x="46" y="635" font-size="22">商品标称：20 x 19 x 6 mm；6 mm 是否包含排针尚不清楚。</text>
<text x="46" y="674" font-size="22">用户报告：单排 6P，节距 2.54 mm；首末针中心理论跨度 12.70 mm。</text>
<text x="46" y="716" font-size="18" fill="#64748b">依据：用户测量及商品图片。背面照片是另一观察面，不能直接套用正面的左右关系。2026-09-27</text>
