<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">ATOM Lite cellular GNSS base: concept and size inputs</title>
  <desc id="desc">A 24 by 24 millimetre target enclosure contains an approximately 20 millimetre Tiny board footprint. The electrical concept uses ATOM Lite, a Cat.1 Tiny board, a separate GNSS receiver and MotoBox. Connector positions, base height and PCB outline are pending. This is an original concept diagram, not a PCB layout or hardware evidence.</desc>
  <rect width="1000" height="500" rx="20" fill="#f4f7fa"/>
  <g font-family="Arial, sans-serif" fill="#172b3a">
    <text x="40" y="48" font-size="28" font-weight="700">ATOM Lite · Cellular + GNSS Base</text>
    <text x="40" y="79" font-size="17" fill="#526777">CONCEPT / IDEA · not a PCB layout or a tested assembly</text>
    <rect x="40" y="105" width="365" height="335" rx="12" fill="#fff"/>
    <text x="62" y="136" font-size="18" font-weight="700">Target enclosure: 24 × 24 mm</text>
    <rect x="99" y="160" width="216" height="216" rx="0" fill="#e5f1f6" stroke="#17779e" stroke-width="3"/>
    <rect x="117" y="178" width="180" height="180" fill="#d0e7d9" stroke="#398258" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="207" y="246" text-anchor="middle" font-size="24" font-weight="700">Tiny board</text>
    <text x="207" y="277" text-anchor="middle" font-size="21">~20 × 20 mm</text>
    <text x="207" y="305" text-anchor="middle" font-size="15">reported measurement</text>
    <text x="62" y="405" font-size="15">6P / 2.54 mm · pad positions pending</text>
    <text x="62" y="425" font-size="15">Wall, clearance and base height: TBD</text>
    <rect x="425" y="105" width="535" height="335" rx="12" fill="#fff"/>
    <text x="447" y="136" font-size="18" font-weight="700">Proposed functional split</text>
    <rect x="445" y="167" width="145" height="84" rx="8" fill="#e5f1f6" stroke="#17779e"/>
    <text x="517" y="201" text-anchor="middle" font-size="20" font-weight="700">ATOM Lite</text>
    <text x="517" y="228" text-anchor="middle" font-size="15">Control + status</text>
    <path d="M590 209H624" fill="none" stroke="#526777" stroke-width="2"/>
    <path d="M619 204L626 209L619 214" fill="none" stroke="#526777" stroke-width="2"/>
    <rect x="628" y="167" width="140" height="84" rx="8" fill="#d0e7d9" stroke="#398258"/>
    <text x="698" y="201" text-anchor="middle" font-size="20" font-weight="700">Tiny Cat.1</text>
    <text x="698" y="228" text-anchor="middle" font-size="15">Cellular uplink</text>
    <path d="M768 209H802" fill="none" stroke="#526777" stroke-width="2"/>
    <path d="M797 204L804 209L797 214" fill="none" stroke="#526777" stroke-width="2"/>
    <rect x="806" y="167" width="133" height="84" rx="8" fill="#eef0f9" stroke="#6c75a2"/>
    <text x="873" y="201" text-anchor="middle" font-size="20" font-weight="700">MotoBox</text>
    <text x="873" y="228" text-anchor="middle" font-size="15">Telemetry</text>
    <rect x="445" y="299" width="200" height="72" rx="8" fill="#fff0d6" stroke="#b68832"/>
    <text x="545" y="330" text-anchor="middle" font-size="20" font-weight="700">Separate GNSS</text>
    <text x="545" y="355" text-anchor="middle" font-size="15">Placement to be decided</text>
    <path d="M517 299V257" fill="none" stroke="#526777" stroke-width="2"/>
    <path d="M512 263L517 256L522 263" fill="none" stroke="#526777" stroke-width="2"/>
    <text x="670" y="315" font-size="17" font-weight="700">Type-C power</text>
    <text x="670" y="339" font-size="15">Power path + protection: TBD</text>
    <text x="447" y="405" font-size="15">Tiny GNSS capability is not established.</text>
    <text x="447" y="425" font-size="15">Footprints and electrical interfaces need verification.</text>
    <text x="40" y="477" font-size="15" fill="#526777">DIY Electronics with AI · Requirements → Research → Build → Production preparation</text>
  </g>
</svg>
