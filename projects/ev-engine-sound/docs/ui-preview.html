<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV Engine Sound — 320×240 UI v2 交互预览</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Monaco, Menlo, "SFMono-Regular", monospace;
    background:#090a0b;
    color:#f7f7f7;
    --bg:#0e1012;
    --grid:#777b7e;
    --dim:#303336;
    --orange:#f4802a;
    --yellow:#fdbd2e;
    --blue:#77cee0;
    --pink:#f394be;
    --red:#ee4445;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 50% 15%, #1b1e20 0, #0c0e10 38%, #070809 76%);
  }
  .lab { width:min(1040px, 100vw); padding:24px; }
  .titlebar { display:flex; align-items:end; justify-content:space-between; margin:0 8px 16px; }
  h1 { margin:0; font-size:18px; font-weight:500; letter-spacing:.08em; }
  .version { color:#777b7e; font-size:11px; }
  .screen-shell {
    width:984px;
    height:744px;
    padding:12px;
    border:1px solid #4a4e51;
    border-radius:10px;
    background:#181b1d;
    box-shadow:0 28px 90px #000, inset 0 0 0 1px #272a2c;
  }
  .screen {
    position:relative;
    width:320px;
    height:240px;
    overflow:hidden;
    transform:scale(3);
    transform-origin:top left;
    background:var(--bg);
    border:1px solid var(--grid);
    user-select:none;
    image-rendering:pixelated;
  }
  .base {
    position:absolute;
    inset:0;
    width:320px;
    height:240px;
    pointer-events:none;
    image-rendering:pixelated;
  }
  .header-drag {
    position:absolute;
    z-index:8;
    left:0;
    top:0;
    width:320px;
    height:28px;
    cursor:ns-resize;
    touch-action:none;
  }
  .rpm-readout,.state-readout {
    position:absolute;
    z-index:7;
    top:4px;
    height:18px;
    display:flex;
    align-items:center;
    background:var(--bg);
    font-size:7px;
    line-height:1;
    pointer-events:none;
  }
  .rpm-readout { left:101px; width:68px; color:#f7f7f7; }
  .state-readout { left:173px; width:62px; color:var(--orange); font-size:6px; }
  .hit {
    position:absolute;
    z-index:3;
    top:140px;
    height:38px;
    border:0;
    padding:0;
    margin:0;
    color:transparent;
    background:transparent;
    cursor:pointer;
    touch-action:manipulation;
  }
  .hit:focus-visible { outline:1px solid #fff; outline-offset:-3px; }
  .hit.engine { left:5px; width:153px; }
  .hit.exhaust { left:162px; width:153px; }
  .selector-value {
    position:absolute;
    z-index:2;
    top:156px;
    height:17px;
    display:flex;
    align-items:center;
    background:var(--bg);
    font-size:6.5px;
    line-height:1;
    pointer-events:none;
    white-space:nowrap;
  }
  .selector-value.engine { left:12px; width:133px; color:var(--blue); }
  .selector-value.exhaust { left:169px; width:133px; color:var(--orange); }
  .flash { animation:flash .24s steps(2,end); }
  @keyframes flash { 50% { filter:brightness(1.9); } }
  .throttle {
    position:absolute;
    z-index:4;
    left:5px;
    top:184px;
    width:309px;
    height:47px;
    padding:0;
    border:1px solid var(--red);
    border-radius:0;
    background:transparent;
    color:#f7f7f7;
    cursor:pointer;
    touch-action:none;
  }
  .throttle:active,.throttle.is-held { background:rgba(238,68,69,.10); }
  .throttle.is-off { border-color:var(--grid); }
  .throttle-copy {
    position:absolute;
    z-index:5;
    left:8px;
    top:187px;
    width:161px;
    height:41px;
    padding:3px 6px;
    background:var(--bg);
    pointer-events:none;
  }
  .throttle-copy small { display:block; color:var(--grid); font-size:4.5px; line-height:7px; }
  .throttle-copy strong { display:block; margin-top:3px; font-size:6.5px; font-weight:400; line-height:8px; }
  .throttle-copy span { display:block; margin-top:4px; color:var(--grid); font-size:4.5px; line-height:6px; }
  .countdown { display:none; width:143px; height:3px; margin-top:4px; background:var(--dim); }
  .countdown i { display:block; width:100%; height:100%; background:var(--orange); }
  .is-coasting .countdown { display:block; }
  .drawer-viewport {
    position:absolute;
    z-index:6;
    left:0;
    top:28px;
    width:319px;
    height:112px;
    overflow:hidden;
    pointer-events:none;
  }
  .settings-drawer {
    position:absolute;
    left:0;
    top:0;
    width:319px;
    height:112px;
    transform:translateY(-112px);
    background:#121517;
    border:1px solid var(--grid);
    box-shadow:0 7px 18px rgba(0,0,0,.72);
    touch-action:none;
    pointer-events:auto;
  }
  .drawer-head { height:20px; border-bottom:1px solid var(--dim); padding:4px 9px; font-size:7px; }
  .drawer-head span { float:right; padding-top:1px; color:var(--grid); font-size:4px; }
  .settings-row {
    height:27px;
    display:grid;
    grid-template-columns:75px 1fr 45px;
    align-items:center;
    gap:5px;
    padding:0 9px;
    font-size:5.5px;
  }
  .settings-row output { text-align:right; font-size:5.5px; }
  #volumeOut { color:var(--blue); }
  #redlineOut { color:var(--orange); }
  #autoOffOut { color:var(--pink); }
  input[type=range] {
    width:100%;
    height:10px;
    margin:0;
    appearance:none;
    background:linear-gradient(to right,var(--accent) 0 var(--fill),var(--dim) var(--fill) 100%);
    cursor:ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track { height:4px; background:transparent; }
  input[type=range]::-webkit-slider-thumb {
    width:6px;
    height:10px;
    margin-top:-3px;
    appearance:none;
    border:0;
    border-radius:0;
    background:var(--yellow);
  }
  input[type=range]::-moz-range-track { height:4px; background:transparent; }
  input[type=range]::-moz-range-thumb { width:6px; height:10px; border:0; border-radius:0; background:var(--yellow); }
  .drawer-grab {
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:11px;
    cursor:ns-resize;
    touch-action:none;
  }
  .drawer-grab::before { content:""; position:absolute; left:139px; top:4px; width:40px; height:2px; background:var(--grid); }
  .drawer-grab::after { content:"⌃"; position:absolute; left:157px; top:2px; color:var(--grid); font-size:5px; }
  .notes {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:18px 8px 0;
    color:#a7aaac;
    font-size:12px;
    line-height:1.6;
  }
  .notes span { padding:6px 10px; border:1px solid #303336; background:#111315; }
  .notes b { color:var(--orange); font-weight:500; }
  @media (max-width:1040px), (max-height:900px) {
    .lab { width:720px; padding:16px; }
    .screen-shell { width:660px; height:500px; padding:10px; }
    .screen { transform:scale(2); }
  }
</style>
</head>
<body>
<main class="lab">
  <div class="titlebar">
    <h1>EV ENGINE SOUND · UI v2</h1>
    <span class="version">DESKTOP INTERACTION STUDY · 320×240</span>
  </div>
  <div class="screen-shell">
    <section id="screen" class="screen" aria-label="320×240 固件界面交互预览">
      <img id="base" class="base" src="assets/firmware-ui-v2-tin_can.png" alt="Engine Simulator 风格发动机与可乐罐排气界面">

      <div id="rpm" class="rpm-readout">0 RPM</div>
      <div id="status" class="state-readout">OFF</div>
      <div id="headerDrag" class="header-drag" title="向下拖出设置" aria-label="向下拖出设置菜单"></div>

      <button id="engineHit" class="hit engine" aria-label="切换下一种发动机"></button>
      <button id="exhaustHit" class="hit exhaust" aria-label="切换下一种排气"></button>
      <div id="engineValue" class="selector-value engine">2C&nbsp;&nbsp;270 P-TWIN</div>
      <div id="exhaustValue" class="selector-value exhaust">TIN CAN</div>

      <button id="throttle" class="throttle is-off" aria-label="按住油门"></button>
      <div id="throttleCopy" class="throttle-copy">
        <small>THROTTLE INPUT</small>
        <strong id="throttleTitle">PRESS + HOLD</strong>
        <span id="throttleDetail">STARTS ENGINE AUTOMATICALLY</span>
        <div class="countdown"><i id="countdownBar"></i></div>
      </div>

      <div class="drawer-viewport">
      <section id="drawer" class="settings-drawer" aria-label="快速设置">
        <div class="drawer-head">QUICK SETTINGS <span>AUTO CLOSE 5 s</span></div>
        <label class="settings-row">VOLUME
          <input id="volume" type="range" min="0" max="100" step="1" value="60" style="--accent:var(--blue);--fill:60%">
          <output id="volumeOut">60%</output>
        </label>
        <label class="settings-row">REDLINE
          <input id="redline" type="range" min="6000" max="16000" step="500" value="9000" style="--accent:var(--orange);--fill:30%">
          <output id="redlineOut">9000</output>
        </label>
        <label class="settings-row">AUTO OFF
          <input id="autoOff" type="range" min="1" max="8" step="0.5" value="3" style="--accent:var(--pink);--fill:28.57%">
          <output id="autoOffOut">3.0 s</output>
        </label>
        <div id="drawerGrab" class="drawer-grab" aria-label="向上拖动收起设置"></div>
      </section>
      </div>
    </section>
  </div>
  <div class="notes">
    <span><b>下拉顶栏</b>：音量 / 红线 / 自动熄火</span>
    <span><b>按住油门</b>：自动点火并拉升转速</span>
    <span><b>松开油门</b>：倒计时后自动熄火</span>
    <span><b>点击卡片</b>：发动机 / 排气循环切换</span>
  </div>
</main>
<script>
const engines = [
  '1C  360 CRANK','2C  180 P-TWIN','2C  270 P-TWIN','2C  360 P-TWIN',
  '2C  45 V-TWIN','2C  90 V-TWIN','3C  120 EVEN','3C  270 T-PLANE',
  '4C  EVEN INLINE','4C  CROSSPLANE','5C  INLINE FIVE','6C  INLINE SIX',
  '6C  60 V-SIX','6C  FLAT SIX','8C  FLATPLANE V8','8C  CROSSPLANE V8',
  '10C  72 V-TEN','12C  60 V-TWELVE'
];
const exhausts = [
  {name:'STOCK', file:'stock'},
  {name:'AKRAPOVIC', file:'carbon'},
  {name:'YOSHIMURA', file:'titanium'},
  {name:'TIN CAN', file:'tin_can'},
  {name:'NO MUFFLER', file:'open'}
];
const ui = Object.fromEntries(['base','rpm','status','engineValue','exhaustValue','engineHit','exhaustHit','throttle','throttleCopy','throttleTitle','throttleDetail','countdownBar','drawer','headerDrag','drawerGrab','volume','volumeOut','redline','redlineOut','autoOff','autoOffOut'].map(id => [id, document.getElementById(id)]));

let engineIndex = 2;
let exhaustIndex = 3;
let held = false;
let running = false;
let rpm = 0;
let lastFrame = performance.now();
let releasedAt = 0;
let drawerProgress = 0;
let drawerDrag = null;
let drawerCloseTimer = null;
const activeScreenPointers = new Set();

function armDrawerAutoClose() {
  clearTimeout(drawerCloseTimer);
  if (drawerProgress < 1 || drawerDrag || activeScreenPointers.size) return;
  drawerCloseTimer = setTimeout(() => {
    drawerProgress = 0;
    ui.drawer.style.transition = 'transform 180ms cubic-bezier(.2,.8,.2,1)';
    renderDrawer();
  }, 5000);
}

document.getElementById('screen').addEventListener('pointerdown', event => {
  activeScreenPointers.add(event.pointerId);
  clearTimeout(drawerCloseTimer);
});
function finishScreenTouch(event) {
  if (!activeScreenPointers.delete(event.pointerId)) return;
  armDrawerAutoClose();
}
window.addEventListener('pointerup', finishScreenTouch);
window.addEventListener('pointercancel', finishScreenTouch);

function flash(element) {
  element.classList.remove('flash');
  void element.offsetWidth;
  element.classList.add('flash');
}

ui.engineHit.addEventListener('click', () => {
  engineIndex = (engineIndex + 1) % engines.length;
  ui.engineValue.textContent = engines[engineIndex];
  flash(ui.engineValue);
});

ui.exhaustHit.addEventListener('click', () => {
  exhaustIndex = (exhaustIndex + 1) % exhausts.length;
  const exhaust = exhausts[exhaustIndex];
  ui.exhaustValue.textContent = exhaust.name;
  ui.base.src = `assets/firmware-ui-v2-${exhaust.file}.png`;
  flash(ui.exhaustValue);
});

function setEngineVisual(status, color) {
  ui.status.textContent = status;
  ui.status.style.color = color;
  ui.rpm.textContent = `${Math.round(rpm / 10) * 10} RPM`;
}

function holdThrottle(event) {
  event.preventDefault();
  held = true;
  running = true;
  releasedAt = 0;
  ui.throttle.setPointerCapture?.(event.pointerId);
  ui.throttle.classList.add('is-held');
  ui.throttle.classList.remove('is-off');
  ui.throttleCopy.classList.remove('is-coasting');
  ui.throttleTitle.textContent = 'THROTTLE OPEN';
  ui.throttleDetail.textContent = 'RELEASE = AUTO OFF';
}

function releaseThrottle() {
  if (!held) return;
  held = false;
  releasedAt = performance.now();
  ui.throttle.classList.remove('is-held');
  ui.throttleCopy.classList.add('is-coasting');
  ui.throttleTitle.textContent = 'THROTTLE RELEASED';
}

ui.throttle.addEventListener('pointerdown', holdThrottle);
ui.throttle.addEventListener('pointerup', releaseThrottle);
ui.throttle.addEventListener('pointercancel', releaseThrottle);
ui.throttle.addEventListener('lostpointercapture', releaseThrottle);

function animate(now) {
  const dt = Math.min(.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (held) {
    const target = Number(ui.redline.value) * .72;
    rpm += (target - rpm) * Math.min(1, dt * 2.4);
    setEngineVisual('ACCEL', 'var(--orange)');
  } else if (running) {
    const idle = 1200;
    rpm += (idle - rpm) * Math.min(1, dt * 3.2);
    const duration = Number(ui.autoOff.value);
    const elapsed = (now - releasedAt) / 1000;
    const remaining = Math.max(0, duration - elapsed);
    ui.throttleDetail.textContent = `AUTO OFF IN ${remaining.toFixed(1)} s`;
    ui.countdownBar.style.width = `${duration ? remaining / duration * 100 : 0}%`;
    setEngineVisual('COAST', 'var(--yellow)');
    if (elapsed >= duration) {
      running = false;
      rpm = 0;
      ui.throttle.classList.add('is-off');
      ui.throttleCopy.classList.remove('is-coasting');
      ui.throttleTitle.textContent = 'PRESS + HOLD';
      ui.throttleDetail.textContent = 'STARTS ENGINE AUTOMATICALLY';
      setEngineVisual('OFF', 'var(--grid)');
    }
  } else {
    rpm = 0;
    setEngineVisual('OFF', 'var(--grid)');
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function updateRange(input, output, format) {
  const min = Number(input.min);
  const max = Number(input.max);
  const value = Number(input.value);
  input.style.setProperty('--fill', `${(value - min) / (max - min) * 100}%`);
  output.textContent = format(value);
}
ui.volume.addEventListener('input', () => { updateRange(ui.volume, ui.volumeOut, value => `${value}%`); armDrawerAutoClose(); });
ui.redline.addEventListener('input', () => { updateRange(ui.redline, ui.redlineOut, value => `${value}`); armDrawerAutoClose(); });
ui.autoOff.addEventListener('input', () => { updateRange(ui.autoOff, ui.autoOffOut, value => `${value.toFixed(1)} s`); armDrawerAutoClose(); });
function renderDrawer() {
  ui.drawer.style.transform = `translateY(${(drawerProgress - 1) * 112}px)`;
}
function startDrawerDrag(event) {
  if (event.target.matches('input')) return;
  event.preventDefault();
  clearTimeout(drawerCloseTimer);
  drawerDrag = { pointerId:event.pointerId, y:event.clientY, progress:drawerProgress };
  event.currentTarget.setPointerCapture?.(event.pointerId);
  ui.drawer.style.transition = 'none';
}
function moveDrawer(event) {
  if (!drawerDrag || event.pointerId !== drawerDrag.pointerId) return;
  const previewScale = document.getElementById('screen').getBoundingClientRect().height / 240;
  drawerProgress = Math.max(0, Math.min(1, drawerDrag.progress + (event.clientY - drawerDrag.y) / (112 * previewScale)));
  renderDrawer();
}
function endDrawer(event) {
  if (!drawerDrag || event.pointerId !== drawerDrag.pointerId) return;
  drawerProgress = drawerProgress > .38 ? 1 : 0;
  drawerDrag = null;
  ui.drawer.style.transition = 'transform 180ms cubic-bezier(.2,.8,.2,1)';
  renderDrawer();
  armDrawerAutoClose();
}
[ui.headerDrag, ui.drawerGrab].forEach(target => {
  target.addEventListener('pointerdown', startDrawerDrag);
  target.addEventListener('pointermove', moveDrawer);
  target.addEventListener('pointerup', endDrawer);
  target.addEventListener('pointercancel', endDrawer);
});
</script>
</body>
</html>
