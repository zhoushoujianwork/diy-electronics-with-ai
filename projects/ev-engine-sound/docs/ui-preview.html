<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV Engine Sound — 320×240 UI Preview</title>
<style>
  :root { color-scheme: dark; font-family: Monaco,Menlo,monospace; background:#0e1012; color:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#090a0b; }
  .stage { width:680px; }
  .screen-shell { width:660px; height:500px; padding:10px; border-radius:8px; background:#1b1e20; box-shadow:0 22px 70px #000,inset 0 0 0 1px #777b7e; }
  .screen { width:320px; height:240px; position:relative; overflow:hidden; transform:scale(2); transform-origin:top left; background:#0e1012; border:1px solid #777b7e; user-select:none; }
  .top { height:28px; display:flex; align-items:center; padding:3px 6px; gap:7px; border-bottom:1px solid #777b7e; background:#0e1012; font-size:8px; }
  .top button { width:53px; height:22px; border:1px solid #777b7e; border-radius:0; background:#0e1012; color:#fff; font:7px Monaco,monospace; }
  .pulse { width:6px; height:6px; border-radius:50%; background:#ee4445; box-shadow:0 0 4px #ee4445; }
  .rpm { color:#fff; min-width:69px; }
  .state { color:#f4802a; flex:1; }
  .set { max-width:42px; color:#fff!important; }
  .powertrain { display:block; width:320px; height:108px; image-rendering:pixelated; }
  .selectors { position:absolute; left:6px; top:139px; display:flex; gap:6px; }
  .selector { width:151px; height:39px; padding:4px 8px; text-align:left; border-radius:0; border:1px solid #77cee0; background:#0e1012; color:#77cee0; font:7px Monaco,monospace; cursor:pointer; }
  .selector.exhaust { border-color:#f4802a; color:#f4802a; }
  .selector small { display:block; color:#777b7e; font-size:6px; margin-bottom:4px; }
  .selector strong { display:block; white-space:nowrap; overflow:hidden; font-size:7px; }
  .selector:active { transform:translateY(1px); background:#25282b; }
  .selector.flash { animation:flash .24s steps(2,end); }
  @keyframes flash { 50% { background:#294235; color:#fff; } }
  .redline { position:absolute; left:8px; top:182px; width:304px; font-size:6px; color:#fff; }
  .track { height:5px; margin-top:4px; background:#303336; }
  .track::before { content:""; display:block; width:72%; height:100%; background:#f4802a; }
  .track::after { content:""; display:block; width:6px; height:9px; margin:-7px 0 0 70%; background:#fdbd2e; }
  .rev { position:absolute; left:8px; top:207px; width:304px; height:27px; border:1px solid #ee4445; border-radius:0; background:#0e1012; color:#fff; font:8px Monaco,monospace; letter-spacing:1px; }
  .legend { margin-top:22px; color:#a7aaac; font-size:13px; line-height:1.65; }
  .legend b { color:#f4802a; }
</style>
</head>
<body>
<main class="stage">
  <div class="screen-shell">
    <section class="screen" aria-label="320 by 240 embedded UI preview">
      <header class="top"><button>START</button><span class="pulse"></span><span class="rpm">4200 RPM</span><span class="state">ACCEL</span><button class="set">SET</button></header>
      <img id="powertrain" class="powertrain" src="assets/powertrain-stock.png" alt="Engine Simulator styled cutaway engine, ignition, exhaust and throttle display">
      <div class="selectors">
        <button id="engine" class="selector"><small>ENGINE · TAP NEXT</small><strong>2C  270 P-TWIN  &gt;</strong></button>
        <button id="exhaust" class="selector exhaust"><small>EXHAUST · TAP NEXT</small><strong>STOCK  &gt;</strong></button>
      </div>
      <div class="redline"><span>REDLINE&nbsp;&nbsp;9000 RPM</span><div class="track"></div></div>
      <button class="rev">HOLD THROTTLE</button>
    </section>
  </div>
  <p class="legend">Exact <b>320×240</b> layout at 2× nearest-neighbour scale. Click either selector: every tap advances one item and wraps; there is no swipe gesture.</p>
</main>
<script>
const engines=[['1C','360 CRANK'],['2C','180 P-TWIN'],['2C','270 P-TWIN'],['2C','360 P-TWIN'],['2C','45 V-TWIN'],['2C','90 V-TWIN'],['3C','120 EVEN'],['3C','270 T-PLANE'],['4C','EVEN INLINE'],['4C','CROSSPLANE'],['5C','INLINE FIVE'],['6C','INLINE SIX'],['6C','60 V-SIX'],['6C','FLAT SIX'],['8C','FLATPLANE V8'],['8C','CROSSPLANE V8'],['10C','72 V-TEN'],['12C','60 V-TWELVE']];
const exhausts=[
  ['STOCK','assets/powertrain-stock.png'],
  ['AKRAPOVIC','assets/powertrain-akrapovic.png'],
  ['YOSHIMURA','assets/powertrain-yoshimura.png'],
  ['TIN CAN','assets/powertrain-tin-can.png'],
  ['NO MUFFLER','assets/powertrain-straight.png']
];
let engineIndex=2,exhaustIndex=0;
function pulse(button){button.classList.remove('flash');void button.offsetWidth;button.classList.add('flash');}
document.querySelector('#engine').onclick=e=>{engineIndex=(engineIndex+1)%engines.length;e.currentTarget.querySelector('strong').textContent=engines[engineIndex].join('  ')+'  >';pulse(e.currentTarget);};
document.querySelector('#exhaust').onclick=e=>{exhaustIndex=(exhaustIndex+1)%exhausts.length;e.currentTarget.querySelector('strong').textContent=exhausts[exhaustIndex][0]+'  >';document.querySelector('#powertrain').src=exhausts[exhaustIndex][1];pulse(e.currentTarget);};
</script>
</body>
</html>
