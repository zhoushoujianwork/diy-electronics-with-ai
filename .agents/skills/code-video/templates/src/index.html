<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>code-video</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
  import { drawFrame, drawScene, total } from './timeline.js';
  import { loadAssets } from './lib/assets.js';

  // 任何错误都记录下来，渲染器发现就让整个渲染失败
  window.__errors = [];
  window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason)));

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  window.renderFrame = (t, sceneId) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    if (sceneId) drawScene(ctx, sceneId, t);
    else drawFrame(ctx, t);
    if (window.__errors.length) throw new Error(window.__errors.join('; '));
    return true;
  };

  // 渲染器用：只画不导出，帧由 Playwright 截图取得
  window.drawAt = (t, sceneId) => {
    window.renderFrame(t, sceneId);
  };

  window.__total = total;
  try {
    await document.fonts.load('700 40px "PingFang SC"');
    await document.fonts.load('400 30px Menlo');
    await loadAssets();
    window.__ready = true;
    // ?scene=ID&t=秒：直接在页面里预览单个场景
    const q = new URLSearchParams(location.search);
    if (q.has('t')) window.renderFrame(parseFloat(q.get('t')), q.get('scene'));
  } catch (e) {
    window.__errors.push(String(e));
  }
</script>
</body>
</html>
