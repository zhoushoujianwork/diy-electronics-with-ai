    - type: Analog microphone input and amplified analog output
      count: 1
      notes: MICOUT has a typical 1.23 V DC bias under datasheet conditions. An audio ADC or codec is required to obtain digital PCM; there is no PDM or I2S output.
      source_refs: [official-product, official-datasheet]
