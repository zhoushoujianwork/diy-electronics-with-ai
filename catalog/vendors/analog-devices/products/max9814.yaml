notes:
  - This record describes the IC, grouped under audio-module because the current catalog schema has no audio-IC category. It does not identify or validate any third-party MAX9814 microphone breakout, its microphone capsule, or its PCB revision.
  - Without compression, the selectable total gain is 40, 50, or 60 dB; the variable-gain stage provides 20 dB of compression. Attack time is capacitor-programmed, release ratio is selectable, and hold time is fixed at 30 ms (official-datasheet).
  - The datasheet supply-current values are 3.1 mA typical and 6 mA maximum under the stated conditions; they are not the current of a complete microphone breakout plus ADC. The internal microphone-bias generator is nominally 2 V (official-datasheet).
  - The advertised 0.04 percent typical THD+N is an amplifier electrical measurement under specified signal, gain, load, and AGC conditions; it is not a complete microphone module acoustic-distortion measurement (official-datasheet).
  - AGC changes gain with level and does not provide acoustic echo cancellation, selective noise removal, or automatic speaker/microphone switching. The chip has a shutdown input, but its availability on a breakout requires that board's documentation.
  - A codec microphone input may already supply bias and substantial gain. Verify coupling, attenuation, input range, and gain staging before adding this amplifier; never connect MICOUT to a digital PDM or I2S input.
  - Selection guidance is in docs/research/pdm-vs-max9814-audio-frontends.md. No host build or hardware audio validation is claimed.
