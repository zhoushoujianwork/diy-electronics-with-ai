summary: Passive infrared motion sensor HAT for compatible M5StickC-family hosts, with a digital GPIO output.
specifications:
  interfaces:
    - type: GPIO digital output
      count: 1
      notes: The onboard AS312 output is routed through a 1 kilohm series resistor to GPIO36 on the documented StickC host; high indicates a detected infrared trigger. The official schematic contains no status-indicator LED.
      source_refs: [official-docs, official-docs-zh, official-schematic, official-store]
  power:
    input_voltage_nominal_v: 3.3
    logic_voltage_v: 3.3
    source_refs: [official-docs, official-docs-zh]
