notes:
  - The official store and schematic identify the onboard sensor as AS312; the related bare-component record is catalog/vendors/senba-sensing/products/as312.yaml.
  - Official nominal detection distance is 500 cm, sensing angle is less than 100 degrees, and trigger hold time is 2 seconds.
  - Official static-current figure is less than 60 microamperes and the stated operating-temperature range is -20 to 80 degrees Celsius.
  - Compatibility and the actual GPIO must be checked against the exact host model before connection.
