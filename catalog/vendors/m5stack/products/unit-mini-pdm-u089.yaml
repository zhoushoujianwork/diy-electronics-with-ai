validation:
  level: cataloged
notes:
  - The official schematic shows 5 V entering an HT7333 regulator and a 3.3 V microphone rail. The bare microphone's 1.6-3.6 V supply range must not be substituted for the finished Unit's documented 5 V connector supply. No whole-Unit peak-current value was established.
  - M5Stack lists sensitivity of -22 dBFS at 94 dB SPL and 1 kHz, typical A-weighted SNR of 61.4 dB, and typical THD of 1 percent at 100 dB SPL and 1 kHz. These are acoustic specifications, not evidence of intelligibility at a particular distance.
  - The linked Knowles Revision A sheet instead lists nominal SNR of 61.5 dB(A), a 1 percent maximum THD at 100 dB SPL, and 600 microamperes maximum microphone current under its stated conditions. Preserve these source/qualifier differences; the M5Stack page's 600 microampere operating-current entry is not a measured peak for the finished Unit.
  - Knowles specifies an active clock range of 1.0-3.25 MHz, sleep below 1 kHz with nominal 25 and maximum 45 microamperes microphone current, and up to 10 ms wake-up time. Removing supply causes powered-down mode; stopping the clock causes sleep, not supply removal. This is not voice-triggered wake-up.
  - No built-in AGC, acoustic echo cancellation, loudspeaker drive, or outdoor ingress rating is established by the cited Unit documentation.
  - K230/CanMV selection guidance and the distinction from MAX9814 analog front ends are in docs/research/pdm-vs-max9814-audio-frontends.md; host pin compatibility and real-device audio quality remain unverified.
