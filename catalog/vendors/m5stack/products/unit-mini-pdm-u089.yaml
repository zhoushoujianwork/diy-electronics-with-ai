specifications:
  interfaces:
    - type: PDM digital microphone
      count: 1
      notes: Host supplies CLK and receives DAT; this is a PDM bitstream, not standard I2S PCM with BCLK and LRCLK. The schematic ties the microphone SELECT input to ground.
      source_refs: [official-docs, official-docs-zh, official-schematic, microphone-datasheet]
  connectors:
    - type: HY2.0-4P
      count: 1
      notes: Official documentation identifies a Grove connection carrying power, ground, PDM clock, and PDM data. Verify mating orientation and the exact host pin map separately.
      source_refs: [official-docs, official-docs-zh]
