notes:
  - This is an IC record, grouped under sensor-module because the current catalog schema has no sensor-IC category. It does not describe a finished BMI270 breakout.
  - The datasheet specifies VDD from 1.71 V to 3.6 V and VDDIO from 1.2 V to 3.6 V (Basic Description and Table 1). Power-sequencing and host logic compatibility still need design-specific checks.
  - At VDD = 1.8 V and 25 C, Table 1 gives 10 microampere typical for accelerometer-only low-power mode at 25 Hz, plus approximately 3 microampere depending on enabled advanced features. Table 6 says accelerometer-only low-power mode can be as low as 4 microampere under other ODR settings. These are not complete board standby-current figures.
  - The any-motion feature uses acceleration slope and configurable threshold and duration (section 4.8.2). After every power-on reset or soft reset, the host must upload an 8 kB initialization configuration before using the device (section 4.4).
  - Manufacturer typical applications emphasize wearables and related devices. The cited datasheet does not establish automotive-grade qualification.
