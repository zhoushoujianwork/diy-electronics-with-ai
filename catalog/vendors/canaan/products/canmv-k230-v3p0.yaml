vendor_id: canaan
name: Canaan CanMV K230 V3.0
family: CanMV K230
model: CanMV K230 V3.0
revision: "3.0"
category: development-board
lifecycle: unknown
summary: Canaan K230 development board supported by CanMV, with a publicly available V3.0 LPDDR4 schematic and PCB project that includes analog microphone and expansion-header circuitry.
specifications:
  processor:
    manufacturer: Canaan
    model: K230
    architecture: Dual 64-bit RISC-V C908
    cores: 2
    max_frequency_hz: 1600000000
    source_refs: [k230-datasheet, canmv-board-target]
  memory:
    storage_notes: The 2024-05-09 official V3.0 engineering project specifies U23 as K4F8E304HB-MGCJ and describes LPDDR4 x32; numeric capacity and fitted-part substitutions have not been independently checked in this record.
    source_refs: [v3-hardware-project]
  interfaces:
    - type: Analog microphone
      count: 1
      notes: The Peripherial schematic sheet specifies MIC1 as Goertek B4012AP422-003, an electret microphone. This is the official design, not a check of any particular assembled board or its acoustic performance.
      source_refs: [v3-hardware-project]
  connectors:
    - type: 2x20 2.54 mm expansion header
      count: 1
      notes: JP1 is HEADER_20X2_H in the K230 sheet, with a HEADER_2x20_H_F_2.54MM device definition. Per-pin routing, voltage domains, and mating orientation require a separate board-profile review.
      source_refs: [v3-hardware-project]
    - type: Analog audio jack
      count: 1
      notes: AUDIO1 is Audio_PJ-3220 in the Peripherial sheet, which also contains HP_OUTL and HP_OUTR nets. Exact contact wiring and load-drive capability are not established by this catalog entry.
      source_refs: [v3-hardware-project]
software:
