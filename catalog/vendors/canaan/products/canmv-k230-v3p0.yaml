validation:
  level: cataloged
notes:
  - The K230 has one core rated up to 800 MHz and one core rated up to 1.6 GHz; max_frequency_hz records the SoC maximum rather than a shared per-core clock.
  - The official board target identifies the K230 MCU and the CanMV K230 V3.0 board name, but does not establish this board's LPDDR capacity, connector exposure, pin map, dimensions, or power limits; those facts are intentionally omitted.
  - The shared CanMV v1.8 PyAudio implementation supports PDM input with input_device_index=1, stereo channel groups, 64-times oversampling, and per-group 3A configuration. This establishes a software path, not this board's exposed pins or measured PDM/AEC compatibility (canmv-pyaudio).
  - The PDM recording example configures Lushan Pi pins and must not be copied as V3.0 wiring. See docs/research/pdm-vs-max9814-audio-frontends.md for microphone selection, clock and channel constraints, and pending hardware checks (canmv-pdm-example).
