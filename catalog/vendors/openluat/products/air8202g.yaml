    source_refs: [product-manual]
  wireless:
    - type: cellular
      standard: 4G LTE Cat.1
      chipset: Air780EGG
      source_refs: [product-manual, module-overview]
  interfaces:
    - type: USB
      notes: 板上 Type-C 用于下载、LuaTools 调试及充电；下载模式操作按对应版本官方说明执行。
      source_refs: [product-manual, hardware-circuit, download-debug]
  connectors:
    - type: USB-C
      count: 1
      notes: 使用 5 V USB 供电和充电；包含配套下载板使用的特殊信号安排，不推定 USB PD 能力。
      source_refs: [hardware-circuit]
    - type: battery connector
      count: 1
      notes: 官方说明为 1.25 mm 间距锂电池插座；针序及极性需按实物和原理图核对。
      source_refs: [hardware-circuit]
