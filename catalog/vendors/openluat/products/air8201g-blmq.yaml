validation:
  level: cataloged
notes:
  - 二次开发语言为 Lua，运行于 LuatOS；可自行实现定位、运动触发、低功耗及网络上报，修改出厂应用以接自己的服务器。Air780EGH 不支持 C-SDK，EGH/EGG/EGP 不支持 AT 指令。[module-overview, factory-software]
  - 硬件含 GNSS 接收和 G-Sensor；V1.5 原理图列 DA267 三轴加速度计。官方资料未列陀螺仪，不能据此登记为六轴 IMU。[hardware-guide, hardware-schematic]
  - BLMQ 硬件支持 BLE、气压计和音频，但所引用出厂软件默认未启用 BLE；需区分硬件能力与当前应用配置。[hardware-guide, factory-software]
  - 需另外配套 4G、GNSS、蓝牙天线及调试板/FPC；不能用核心板尺寸代表含天线、电池和外壳的整机尺寸。[hardware-guide]
  - 官方出厂软件说明支持通过调试板 USB 供电；未确认该板无电池全负载供电的持续/峰值能力。[factory-software]
  - 未确认实物硬件修订、精确尺寸及充电电流条件；不将店铺图片中的最大电流或耐压直接登记为工作额定值。
  - 此记录只完成官方资料核对；未进行该板的构建、烧录、服务器接入、功耗或硬件测试。
