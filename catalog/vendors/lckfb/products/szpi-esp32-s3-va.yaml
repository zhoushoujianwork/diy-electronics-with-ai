schema_version: 1
id: szpi-esp32-s3-va
vendor_id: lckfb
name: LCKFB Shi Zhan Pai ESP32-S3 VA
family: Shi Zhan Pai ESP32-S3
model: LCKFB-SZPI-ESP32-S3-VA
category: development-board
lifecycle: active
summary: LCKFB ESP32-S3 development board with a 2-inch touch display, audio input and output, and a six-axis IMU.
board_profile: boards/lckfb-szpi-esp32-s3-va/
specifications:
  processor:
    manufacturer: Espressif Systems
    model: ESP32-S3-WROOM-1-N16R8
    architecture: Xtensa LX7
    cores: 2
    max_frequency_hz: 240000000
    source_refs: [official-docs]
  memory:
    flash_bytes: 16777216
    ram_bytes: 524288
    psram_bytes: 8388608
    storage_notes: Onboard microSD/TF slot uses 1-bit SD mode; removable card capacity is not specified here.
    source_refs: [official-docs]
  wireless:
    - type: wi-fi
      standard: 2.4 GHz 802.11 b/g/n
      source_refs: [official-docs]
    - type: bluetooth
      standard: Bluetooth 5 LE
      source_refs: [official-docs]
  display:
    technology: IPS TFT LCD with capacitive touch
    width_px: 320
    height_px: 240
    diagonal_in: 2.0
    controller: ST7789
    source_refs: [official-docs, lcd-tutorial]
  interfaces:
    - type: SPI display
      notes: ST7789; official display example uses a 320 by 240 landscape canvas.
      source_refs: [official-docs, lcd-tutorial]
    - type: I2C capacitive touch
      notes: FT6336; official LVGL tutorial uses the esp_lcd_touch_ft5x06 driver.
      source_refs: [official-docs, lvgl-tutorial]
    - type: Six-axis IMU
      notes: QMI8658 with three-axis acceleration and three-axis angular rate, connected over I2C.
      source_refs: [official-docs]
    - type: Audio playback
      notes: ES8311 codec, NS4150B mono Class-D amplifier, and DB1811AB50 1 W speaker.
      source_refs: [official-docs]
    - type: Audio capture
      notes: ES7210 four-channel ADC; two ZTS6216 microphones and one DAC feedback channel are wired for echo-cancellation applications. This does not establish software AEC performance.
      source_refs: [official-docs, board-introduction]
    - type: Camera
      notes: GC0308, nominal 0.3 megapixel, connected through an internal board-to-board connector.
      source_refs: [board-introduction]
    - type: USB hub and UART bridge
      notes: CH334F hub connects the external Type-C upstream to CH340K USB-UART and ESP32-S3 USB-OTG downstream paths.
      source_refs: [official-docs, board-introduction]
    - type: I2C GPIO expander
      notes: Official resource diagram labels TCA9557; the circuit introduction assigns LCD chip select, amplifier enable and camera power-down to the expander. Exact fitted part and revision must be checked before electrical substitution.
      source_refs: [official-project, board-introduction]
  connectors:
    - type: USB Type-C
      count: 1
      notes: Power, download/debug, and USB data via the onboard hub; do not identify the MCU USB path solely by connector appearance.
      source_refs: [official-docs]
    - type: GH1.25-5P expansion
      count: 2
      notes: One shared I2C port and one multifunction port; 3.3 V and 5 V supply pins are described. Connector ordering and output-current limits require exact schematic verification. CAN-capable GPIO does not establish a ready-to-wire CAN bus interface.
      source_refs: [official-project, board-introduction]
    - type: microSD / TF
      count: 1
      notes: 1-bit SD mode, using CMD, CLK and DAT0.
      source_refs: [board-introduction]
  power:
    input_voltage_nominal_v: 5
    logic_voltage_v: 3.3
    source_refs: [official-docs]
  mechanical:
    width_mm: 69
    height_mm: 41
    source_refs: [official-project, official-docs]
software:
  toolchains: [ESP-IDF]
  frameworks: [LVGL]
  source_refs: [official-docs, lvgl-tutorial]
