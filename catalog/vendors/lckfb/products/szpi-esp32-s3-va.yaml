validation:
  level: cataloged
notes:
  - Official pin and power facts are documented in the linked board profile; this record claims cataloged validation only.
  - Display width_px and height_px use the official landscape example orientation, not an assertion about the panel's unrotated addressing axes. Both 240 by 320 and 320 by 240 describe the same pixel count.
  - Mechanical width and height describe the complete enclosure, not the LCD active area or PCB outline.
  - Enclosure depth is deliberately omitted from mechanical fields because the official product drawing says 15 mm while the documentation introduction says 14 mm. Exact revision and mechanical CAD must be checked before enclosure design.
  - The exact LCD active-area dimensions, cover-glass outline, luminance, total-board peak current, and expansion-port current budgets remain unestablished in the reviewed sources.
  - The board introduction identifies separate 3.3 V rails for MCU and audio circuits; the two regulators are listed as SY8088AAC in the official hardware table. Per-regulator ratings are not a board-level current budget.
