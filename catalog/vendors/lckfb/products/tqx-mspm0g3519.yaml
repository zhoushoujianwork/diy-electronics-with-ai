validation:
  level: cataloged
notes:
  - OLED 教程（oled-tutorial）写 0.96 英寸，官方首页核心板标注图（core-board-annotation）写 1.29 英寸；两份资料存在尺寸冲突，尚未确认适用修订或实物尺寸，故省略 diagonal_in，不据此推定面板或显示区物理尺寸。
  - 官方主控封装为 LQFP-64；model 表示官方板名中的 MCU 型号，不代表厂商独立 SKU。精确 PCB 修订未确认。
  - 本记录描述官方套件资源，不表示任何具体实物的配件齐全、型号匹配、编译或硬件验证通过。
  - 供电范围、GPIO 电气限值、整板峰值电流、接口方向和尺寸未在本次核对中建立，故不填写 power、mechanical 或引脚表。
  - 官方首页的网页烧录路径是 Type-C 有线连接，支持 HEX 与 TI-TXT；不能把无线串口透传能力写成已支持无线烧录。
  - 官方 AI 教程提供 mspm0kit-tianqiaoxing 及其依赖 mspm0-ccs，并列出 Windows/macOS/Linux 配置路径；这不等于本机工具链已安装或可用。
  - AI Skill 部署页同时写 MSPM0 SDK 至少 2.10.00.04 和基于 2.05.01.00 开发测试，存在版本矛盾；使用时须核对当前仓库和 SDK，不能据此固定兼容版本。
