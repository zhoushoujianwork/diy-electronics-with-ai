id: tqx-mspm0g3519
vendor_id: lckfb
name: 立创·天巧星 MSPM0G3519 开发板套件
family: Tian Qiao Xing MSPM0
model: MSPM0G3519
category: development-board
lifecycle: active
summary: 基于 TI MSPM0G3519 的核心板与 IO 扩展底板套件，官方配套无线串口模块和 XDS110 下载器。
specifications:
  processor:
    manufacturer: Texas Instruments
    model: MSPM0G3519
    architecture: Arm Cortex-M0+
    max_frequency_hz: 80000000
    source_refs: [official-docs]
  memory:
    flash_bytes: 524288
    ram_bytes: 131072
    storage_notes: 数值为 MCU 片内 Flash/SRAM；官方首页还列出外部 Flash，本记录不推定其容量。
    source_refs: [official-docs]
  display:
    technology: Monochrome OLED
    width_px: 128
    height_px: 64
    controller: SSD1306
    source_refs: [oled-tutorial, core-board-annotation]
  interfaces:
    - type: GPIO / ADC / PWM / UART / SPI / I2C
      notes: 核心板可独立使用，IO 扩展底板引出接口并提供板载外设；引脚复用须按精确修订核对。
      source_refs: [official-docs]
    - type: Six-axis IMU
      notes: 官方教程标注 ST LSM6DS3TRC，含三轴加速度计与三轴陀螺仪，经 I2C 通信。
      source_refs: [imu-tutorial]
    - type: SWD debug
      notes: 配套独立 XDS110 用于程序下载、断点和单步调试，另带串口功能。
      source_refs: [official-docs, ccs-setup]
    - type: Wireless UART
      notes: 配套无线串口模块提供双向数据通信；不据此推断无线烧录或无线 SWD 调试能力。
      source_refs: [official-docs]
  connectors:
    - type: USB Type-C
      notes: 官方首页说明可通过数据线连接开发板，使用 MSPM0 网页串口工具烧录；此处不推定连接器数量或电气限值。
      source_refs: [official-docs]
software:
  toolchains: [TI Code Composer Studio, TI SysConfig, TI DSLite]
  frameworks: [TI MSPM0 SDK]
  source_refs: [ccs-setup, ai-skill-guide]
