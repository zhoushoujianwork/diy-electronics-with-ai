family: Lushan Pi K230
model: Lushan Pi K230 CanMV
category: development-board
lifecycle: active
summary: LCKFB K230 development board with 1 GB external LPDDR4, CanMV support, camera and display interfaces, Wi-Fi, audio, and USB host expansion.
specifications:
  processor:
    manufacturer: Canaan
    model: K230
    architecture: Dual 64-bit RISC-V C908
    cores: 2
    max_frequency_hz: 1600000000
    source_refs: [comparison]
  memory:
    ram_bytes: 1073741824
    storage_notes: External LPDDR4; TF card storage is supported, with an optional unpopulated SD NAND footprint.
    source_refs: [comparison]
  wireless:
    - type: wi-fi
      standard: 2.4 GHz IEEE 802.11 b/g/n
      chipset: RTL8189FTV
      source_refs: [comparison]
  interfaces:
    - type: MIPI DSI
      count: 1
      notes: Four-lane display interface; the documented default display option is a 3.1-inch touch screen.
      source_refs: [comparison]
    - type: MIPI CSI
      count: 3
      notes: Three two-lane camera interfaces with vertical insertion connectors.
      source_refs: [comparison]
    - type: Audio codec
      count: 1
      notes: On-board microphone and 3.5 mm stereo headphone output.
      source_refs: [comparison]
  connectors:
    - type: USB Type-C
      count: 1
      notes: Power, data, and firmware flashing.
      source_refs: [comparison]
    - type: USB Type-A host
      count: 1
      source_refs: [comparison]
    - type: TF card socket
      count: 1
      source_refs: [comparison]
  power:
    input_voltage_nominal_v: 5
    source_refs: [comparison]
  mechanical:
    width_mm: 70
    height_mm: 45
    source_refs: [comparison]
