notes:
  - 这是官方套件配套模块的描述性目录 ID，未查到独立销售型号、SKU、精确 PCB 修订或官方 USB VID/PID 表。
  - 官方首页标称空旷环境约 10 米通信距离；不代表实测距离或所有环境的可靠性。
  - 操作指南要求板端通过 UART7 发送 AT_RF=ON 命令并以 CRLF 结尾，USB 端 LED 常亮表示连接；完整配置与回显流程以原指南为准。
  - 官方教程称上电默认开启射频，操作指南则要求发送 AT_RF=ON，并描述关闭状态周期输出 RDY；默认状态应按实际固件和批次核对。
  - 操作指南提及安装 CH340 驱动，但其配套 USB 端原理图标 CH570Q；保留这一不一致，不把 CH340 驱动名称当作模块芯片型号或 USB 设备身份依据。
  - 原理图显示开发板端 3V3 供电，USB 端经 VBUS/5V 供电；两端供电不同，未建立完整输入范围、信号容限或峰值电流，故不填写统一 power 字段。保险丝额定值不是模块工作电流。
  - 本次资料只建立无线串口透传能力；未建立无线烧录或无线 SWD 调试支持，亦未进行串口、射频链路或 macOS 驱动实测。
