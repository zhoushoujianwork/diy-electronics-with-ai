family: Tian Qiao Xing wireless UART
category: communication-module
lifecycle: active
summary: 天巧星套件的 2.4 GHz 双向无线串口链路，由电脑 USB 端和开发板端组成，用于日志与数据透传。
specifications:
  wireless:
    - type: other
      standard: 2.4 GHz ISM wireless UART
      chipset: CH570Q
      source_refs: [wireless-tutorial, usb-schematic, board-schematic]
  interfaces:
    - type: UART
      notes: 官方指南规定开发板端 UART7 为固定 115200 baud、8 数据位、无校验、1 停止位；电气引脚表不在本记录中推定。
      source_refs: [operation-guide]
    - type: USB serial
      notes: 官方 USB 端原理图的 D+/D- 直接接 CH570Q，未画出独立 CH340 USB-UART 芯片。
      source_refs: [usb-schematic]
