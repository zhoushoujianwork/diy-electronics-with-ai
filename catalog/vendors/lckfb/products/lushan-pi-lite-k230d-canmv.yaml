validation:
  level: cataloged
notes:
  - The official selection guide rates the KPU at 6 TOPS INT8 and distinguishes this 128 MB K230D board from the 1 GB K230 board.
  - The official documentation contains a Lite V1.1 hardware-validation resource, but the product overview does not make V1.1 a universal revision label; this record therefore omits revision.
  - The documentation also lists a separate 8-24 V DC input; input_voltage_nominal_v records only the USB Type-C 5 V input because the catalog schema cannot represent two disjoint input ranges without implying that intermediate voltages are valid on USB.
  - Connector orientation and individual GPIO assignments are intentionally omitted from the catalog; verify the exact schematic revision before wiring.
