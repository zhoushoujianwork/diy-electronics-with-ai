validation:
  level: cataloged
notes:
  - Microchip identifies BM83SM1-00Tx as A2DP source-capable when programmed with Audio Transceiver firmware; generic BM83 or A2DP labeling alone is not enough.
  - The product page states that source mode can stream to up to two paired sink devices. Pairing behavior, firmware package, supply, pinout, audio clocking, and latency have not been validated here.
  - Product photos and data sheets are linked from the official page; no third-party image or document is redistributed.
