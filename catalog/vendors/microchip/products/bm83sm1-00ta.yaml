summary: Bluetooth audio transceiver module whose AT firmware supports A2DP source output from AUX or I2S audio input.
specifications:
  wireless:
    - type: bluetooth
      standard: Bluetooth 5.0; A2DP source with Audio Transceiver firmware
      source_refs: [bm83-page]
  interfaces:
    - type: AUX audio input
      notes: The manufacturer's BM83SM1-00Tx description lists AUX-in as an input for source operation.
      source_refs: [bm83-page]
    - type: I2S audio input
      notes: The manufacturer's BM83SM1-00Tx description lists I2S as an input for source operation; sample format and wiring remain to be checked against the exact firmware and datasheet.
      source_refs: [bm83-page]
    - type: UART host control
      source_refs: [bm83-page]
