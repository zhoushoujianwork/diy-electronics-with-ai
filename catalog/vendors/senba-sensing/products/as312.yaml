validation:
  level: cataloged
notes:
  - AS312 identifies the sensing component, not every small board sold as an AS312 module. Verify the purchased board's supply range, VCC/GND/OUT order, lens, output hold time, and any regulator or indicator from its exact documentation.
  - Detection distance and angle are system properties strongly affected by the Fresnel lens, enclosure, orientation, ambient temperature, and target motion; no generic module-level range is claimed here.
  - M5Stack U054 is a documented AS312 integration with a 3.3 V supply, digital output routed through a 1 kilohm resistor to GPIO36 on the documented M5StickC host, no schematic indicator LED, a 2 second hold time, a 500 cm nominal range, and an angle below 100 degrees. Those finished-HAT figures must not be copied to an unknown AS312 breakout.
  - Compared with the commonly sold HC-SR501 adjustable breakout class, AS312-based compact modules are appropriate when small size, low-voltage operation, and fixed behavior matter more than trim-pot adjustment. HC-SR501 seller variants are not treated as one traceable product record.
  - In an access-control design, PIR should only wake or start face recognition; identity verification and the lock-control safety path must make the release decision.
