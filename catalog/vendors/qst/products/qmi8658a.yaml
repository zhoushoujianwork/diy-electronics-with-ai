notes:
  - This is an IC record, grouped under sensor-module because the current catalog schema has no sensor-IC category. It does not describe a finished QMI8658A breakout.
  - The datasheet specifies VDD and VDDIO each from 1.71 V to 3.6 V (Table 6). It lists I2C addresses 0x6A and 0x6B selected by SDO/SA0. Interface voltage, pull-ups, and power sequencing need design-specific checks.
  - At VDD = VDDIO = 1.8 V and 25 C, Table 16 gives typical accelerometer-only current of 30 microampere at 3 Hz and 42 microampere at 21 Hz. Table 18 gives 750 microampere at the lowest listed six-axis ODR. These values do not include a complete always-on power domain or a 3 V system measurement.
  - Any-Motion is based on accelerometer samples, works in Non-Sync Sample mode, and can drive INT1 or INT2. Motion configuration is written while accelerometer and gyroscope are disabled (sections 9.1 and 9.4-9.6); verify a chosen low-power ODR and thresholds on hardware before relying on wake-up.
  - The manufacturer lists automotive security systems as an application, but this datasheet alone does not establish automotive-grade qualification.
